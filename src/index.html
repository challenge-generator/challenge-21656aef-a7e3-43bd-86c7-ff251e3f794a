<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Ionic POO Refactoring</title>
  <base href="/"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <link rel="icon" type="image/x-icon" href="assets/icon/favicon.ico"/>
  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>
  <link rel="apple-touch-icon" href="assets/icon/icon.png"/>
  <link rel="apple-touch-startup-image" href="assets/icon/splash.png"/>
  <meta name="application-name" content="Ionic POO"/>
  <meta name="msapplication-TileColor" content="#ffffff"/>
  <meta name="msapplication-TileImage" content="assets/icon/icon.png"/>
  <link rel="manifest" href="manifest.json"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Ionicons';
      src: url('assets/fonts/ionicons.woff2?v=8.3.0') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #000000;
        color: #ffffff;
      }
    }
    .ion-page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .ion-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .loading-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }
    @media (prefers-color-scheme: dark) {
      .loading-container {
        background: #000000;
      }
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0e0e0;
      border-top-color: #3880ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .app-root {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hide {
      display: none !important;
    }
  </style>
  <script>
    // Configuración global de la aplicación
    window.APP_CONFIG = {
      appName: 'Ionic POO Refactoring',
      appVersion: '0.0.1',
      apiUrl: 'https://api.example.com',
      enableDebug: false,
      timeout: 30000,
      retryAttempts: 3
    };
    
    // Detectar si es un dispositivo móvil
    window.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    // Detectar plataforma
    window.platform = {
      isAndroid: /Android/i.test(navigator.userAgent),
      isIOS: /iPhone|iPad|iPod/i.test(navigator.userAgent),
      isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
    };
    
    // Registro de errores para debugging
    window.errorLog = [];
    window.onerror = function(msg, url, line, col, error) {
      window.errorLog.push({
        message: msg,
        url: url,
        line: line,
        column: col,
        error: error,
        timestamp: new Date().toISOString()
      });
      return false;
    };
  </script>
</head>
<body>
  <app-root>
    <div class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  </app-root>
  <noscript>
    <div style="padding: 20px; text-align: center; font-family: sans-serif;">
      <h1>JavaScript Requerido</h1>
      <p>Esta aplicación requiere JavaScript para funcionar.</p>
      <p>Por favor, habilite JavaScript en su navegador.</p>
    </div>
  </noscript>
  <script src="runtime.js" type="module"></script>
  <script src="polyfills.js" type="module"></script>
  <script src="vendor.js" type="module"></script>
  <script src="main.js" type="module"></script>
</body>
</html>
